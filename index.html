<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playses AI - Chat</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="backdrop" class="backdrop"></div>

  <aside id="drawer" class="drawer" aria-label="Menu Navigasi">
    <div class="drawer-top">
      <strong>Menu Playses AI</strong>
      <button id="closeDrawer" class="close-btn" type="button" aria-label="Tutup menu">✕</button>
    </div>
    <a class="nav-item active" href="index.html">Chat</a>
    <a class="nav-item" href="deskripsi.html">description</a>
    <a class="nav-item" href="setting.html">setting</a>

    <div class="history-section">
      <div class="history-header">
        <span class="history-title">Chats</span>
        <button id="newChatBtn" class="new-chat-btn" type="button">+ New</button>
      </div>
      <div id="historyList" class="history-list">
        <div id="historyActionMenu" class="history-action-menu" aria-hidden="true">
          <button id="renameHistoryBtn" class="action-btn" type="button">Rename</button>
          <button id="shareHistoryBtn" class="action-btn" type="button">Share</button>
          <button id="deleteHistoryBtn" class="action-btn history-delete-btn" type="button">Delete</button>
        </div>
      </div>
    </div>
  </aside>

  <div class="box">
    <div class="head">
      <div class="head-left">
        <button id="openDrawer" class="burger-btn" type="button" aria-label="Buka menu">☰</button>
        <strong>Playses AI</strong>
      </div>
      <div class="status-badge">
        <span id="statusDot" class="status-dot" aria-hidden="true"></span>
        <span id="st">Ready</span>
      </div>
    </div>

    <div id="chat" class="chat"></div>

    <div id="msgActionMenu" class="msg-action-menu" aria-hidden="true">
      <button id="copyMsgBtn" class="action-btn" type="button">Copy</button>
    </div>

    <form id="f">
      <input id="inp" type="text" placeholder="Ketik pesanmu" autocomplete="off" required />
      <button id="btn" type="submit">Kirim</button>
    </form>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script>
    (function () {
      const BACKEND_STREAM_URL = "https://regular-datebook-outburst.ngrok-free.dev/chat/stream";
      const BACKEND_TTS_URL = "https://regular-datebook-outburst.ngrok-free.dev/tts?voice=actor1";
      const API_KEY = "playses-ai-key-tetap";
      const DISCORD_INVITE_URL = "https://discord.gg/QxRSNFfU5B";
      const SHARE_BASE_URL = "https://dragon-star-ui.github.io/Playses-AI-/index.html";
      const SERVER_UNAVAILABLE_TEXT =
        "Sorry, there is a problem with the server or the server is down/not yet activated. Please check the server status in our discord community";
      const PRIVATE_LINK_TEXT =
        "This chat link has been changed to private mode by the owner.";

      const DUMMY_GREETINGS = [
        "Hey there! What would you like to talk about today?",
        "Hello! Drop a message whenever you're ready.",
        "Hi! Good to see you here—ask me anything.",
        "Welcome back! Start typing below to begin a chat.",
        "Hey! Ready to chat—what's on your mind?"
      ];

      const STORAGE_SESSIONS_KEY = "playses_ai_sessions_v1";
      const STORAGE_SHARE_MODE_KEY = "playses_ai_share_mode_v1";
      const CONTEXT_MESSAGE_LIMIT = 6;
      const LONG_PRESS_DURATION_MS = 500;
      const TYPEWRITER_DELAY_MS = 30;

      const toastEl = document.getElementById("toast");
      const stEl = document.getElementById("st");
      const statusDotEl = document.getElementById("statusDot");
      const drawerEl = document.getElementById("drawer");
      const backdropEl = document.getElementById("backdrop");
      const openDrawerBtn = document.getElementById("openDrawer");
      const closeDrawerBtn = document.getElementById("closeDrawer");

      const chatEl = document.getElementById("chat");
      const formEl = document.getElementById("f");
      const inpEl = document.getElementById("inp");
      const btnEl = document.getElementById("btn");

      const newChatBtn = document.getElementById("newChatBtn");
      const historyListEl = document.getElementById("historyList");
      const actionMenuEl = document.getElementById("historyActionMenu");
      const renameHistoryBtn = document.getElementById("renameHistoryBtn");
      const shareHistoryBtn = document.getElementById("shareHistoryBtn");
      const deleteHistoryBtn = document.getElementById("deleteHistoryBtn");

      const msgActionMenuEl = document.getElementById("msgActionMenu");
      const copyMsgBtn = document.getElementById("copyMsgBtn");

      let sessions = [];
      let activeSessionId = null;
      let selectedSessionIdForMenu = null;
      let selectedBotMessageText = "";
      let privateLinkBlocked = false;
      let cancelPendingLongPress = null;
      let activeTtsAudio = null;

      function showToast(msg) {
        if (!toastEl) return;
        toastEl.textContent = msg;
        toastEl.classList.add("show");
        clearTimeout(showToast._timer);
        showToast._timer = setTimeout(() => {
          toastEl.classList.remove("show");
        }, 2400);
      }

      window.addEventListener("error", (event) => {
        showToast("JS Error: " + (event.message || "unknown error"));
      });

      function setStatusLabel(label, dotMode) {
        if (stEl) stEl.textContent = label;
        if (statusDotEl) {
          statusDotEl.classList.remove("online", "offline");
          if (dotMode === "online") statusDotEl.classList.add("online");
          else if (dotMode === "offline") statusDotEl.classList.add("offline");
        }
      }

      function getShareMode() {
        const mode = localStorage.getItem(STORAGE_SHARE_MODE_KEY);
        return mode === "private" ? "private" : "public";
      }

      function closeMsgActionMenu() {
        selectedBotMessageText = "";
        if (msgActionMenuEl) {
          msgActionMenuEl.classList.remove("show");
          msgActionMenuEl.setAttribute("aria-hidden", "true");
        }
      }

      function closeHistoryActionMenu() {
        selectedSessionIdForMenu = null;
        if (actionMenuEl) {
          actionMenuEl.classList.remove("show");
          actionMenuEl.setAttribute("aria-hidden", "true");
        }
      }

      function setDrawerOpen(isOpen) {
        if (drawerEl) drawerEl.classList.toggle("open", isOpen);
        if (backdropEl) backdropEl.classList.toggle("show", isOpen);
        if (!isOpen) {
          closeHistoryActionMenu();
          closeMsgActionMenu();
        }
      }

      if (openDrawerBtn) {
        openDrawerBtn.addEventListener("click", (ev) => {
          ev.preventDefault();
          ev.stopPropagation();
          setDrawerOpen(!(drawerEl && drawerEl.classList.contains("open")));
        });
      }

      if (closeDrawerBtn) {
        closeDrawerBtn.addEventListener("click", (ev) => {
          ev.preventDefault();
          ev.stopPropagation();
          setDrawerOpen(false);
        });
      }

      if (backdropEl) {
        backdropEl.addEventListener("click", () => setDrawerOpen(false));
      }

      function generateRandomChatCode() {
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
        let out = "";
        for (let i = 0; i < 12; i++) {
          out += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return out;
      }

      function encodeSessionToBase64(sessionObj) {
        const payload = {
          t: sessionObj.title || "New Chat",
          m: Array.isArray(sessionObj.messages)
            ? sessionObj.messages.map((item) => ({
                cls: item.cls === "user" ? "user" : "bot",
                text: String(item.text || "")
              }))
            : []
        };
        const jsonStr = JSON.stringify(payload);
        const bytes = new TextEncoder().encode(jsonStr);
        let binary = "";
        for (let i = 0; i < bytes.length; i++) {
          binary += String.fromCharCode(bytes[i]);
        }
        return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
      }

      function decodeSessionFromBase64(encodedStr) {
        if (!encodedStr) return null;
        try {
          let base64 = encodedStr.replace(/-/g, "+").replace(/_/g, "/");
          while (base64.length % 4) {
            base64 += "=";
          }
          const binary = atob(base64);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
          }
          const jsonStr = new TextDecoder().decode(bytes);
          const parsed = JSON.parse(jsonStr);
          if (!parsed || !Array.isArray(parsed.m)) return null;
          return {
            title: typeof parsed.t === "string" && parsed.t.trim() ? parsed.t.trim() : "Shared Chat",
            messages: parsed.m
              .filter((item) => item && typeof item.text === "string")
              .map((item) => ({
                cls: item.cls === "user" ? "user" : "bot",
                text: item.text
              }))
          };
        } catch (_) {
          return null;
        }
      }

      function loadSessions() {
        try {
          const raw = localStorage.getItem(STORAGE_SESSIONS_KEY);
          const parsed = raw ? JSON.parse(raw) : [];
          sessions = Array.isArray(parsed) ? parsed : [];
          sessions.forEach((s) => {
            if (!s.shareCode) s.shareCode = generateRandomChatCode();
          });
        } catch (_) {
          sessions = [];
        }
      }

      function saveSessions() {
        localStorage.setItem(STORAGE_SESSIONS_KEY, JSON.stringify(sessions));
      }

      function generateSessionId() {
        return "sess_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7);
      }

      function buildTitleFromMessage(text) {
        const clean = text.trim().replace(/\s+/g, " ");
        if (!clean) return "New Chat";
        return clean.length > 32 ? clean.slice(0, 32).trim() + "..." : clean;
      }

      function getActiveSession() {
        if (!activeSessionId) return null;
        return sessions.find((s) => s.id === activeSessionId) || null;
      }

      function buildShareUrl(session) {
        const encoded = encodeSessionToBase64(session);
        return `${SHARE_BASE_URL}?s=${encodeURIComponent(encoded)}`;
      }

      function updateUrlForSession(session) {
        try {
          const url = new URL(window.location.href);
          if (session && session.shareCode) {
            url.searchParams.set("chat", session.shareCode);
          } else {
            url.searchParams.delete("chat");
            url.searchParams.delete("s");
          }
          window.history.replaceState({}, "", url.toString());
        } catch (_) {}
      }

      function createNewSessionWithFirstMessage(userText) {
        privateLinkBlocked = false;
        const newSession = {
          id: generateSessionId(),
          shareCode: generateRandomChatCode(),
          title: buildTitleFromMessage(userText),
          createdAt: Date.now(),
          messages: []
        };
        sessions.unshift(newSession);
        activeSessionId = newSession.id;
        saveSessions();
        updateUrlForSession(newSession);
        return newSession;
      }

      function setMessageBubbleContent(el, text) {
        if (!el) return;
        el.innerHTML = "";
        const marker = "discord community";
        const markerIdx = text.indexOf(marker);

        if (text.startsWith("Sorry, there is a problem with the server") && markerIdx !== -1) {
          const beforeAndMarker = text.slice(0, markerIdx + marker.length);
          const afterMarker = text.slice(markerIdx + marker.length);

          el.appendChild(document.createTextNode(beforeAndMarker + " "));

          const linkEl = document.createElement("a");
          linkEl.href = DISCORD_INVITE_URL;
          linkEl.textContent = DISCORD_INVITE_URL;
          linkEl.target = "_blank";
          linkEl.rel = "noopener noreferrer";
          linkEl.style.color = "#6ea8fe";
          linkEl.style.textDecoration = "underline";
          linkEl.style.wordBreak = "break-all";
          el.appendChild(linkEl);

          if (afterMarker) {
            el.appendChild(document.createTextNode(afterMarker));
          }
          return;
        }
        el.textContent = text;
      }

      async function copyToClipboard(text) {
        if (!text) return false;
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
            return true;
          }
        } catch (_) {}
        try {
          const helper = document.createElement("textarea");
          helper.value = text;
          helper.style.position = "fixed";
          helper.style.opacity = "0";
          document.body.appendChild(helper);
          helper.select();
          document.execCommand("copy");
          document.body.removeChild(helper);
          return true;
        } catch (_) {
          return false;
        }
      }

      function openMsgActionMenu(text, x, y, anchorEl) {
        if (!msgActionMenuEl || !text) return;
        selectedBotMessageText = text;
        let posX = typeof x === "number" && x > 0 ? x : 24;
        let posY = typeof y === "number" && y > 0 ? y : 120;
        if ((!x || !y) && anchorEl) {
          const rect = anchorEl.getBoundingClientRect();
          posX = rect.left + 10;
          posY = rect.bottom + 6;
        }
        const maxX = Math.max(12, window.innerWidth - 150);
        const maxY = Math.max(12, window.innerHeight - 70);
        msgActionMenuEl.style.left = Math.min(posX, maxX) + "px";
        msgActionMenuEl.style.top = Math.min(posY, maxY) + "px";
        msgActionMenuEl.classList.add("show");
        msgActionMenuEl.setAttribute("aria-hidden", "false");
      }

      async function speakBotText(text, btn) {
        if (!text) return;
        if (activeTtsAudio) {
          activeTtsAudio.pause();
          activeTtsAudio = null;
        }
        const oldLabel = btn.textContent;
        btn.disabled = true;
        btn.textContent = "...";
        try {
          const sep = BACKEND_TTS_URL.includes("?") ? "&" : "?";
          const res = await fetch(`${BACKEND_TTS_URL}${sep}text=${encodeURIComponent(text)}`, {
            method: "GET",
            headers: {
              "X-API-Key": API_KEY,
              "ngrok-skip-browser-warning": "true"
            }
          });
          if (!res.ok) throw new Error(String(res.status));
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const audio = new Audio(url);
          activeTtsAudio = audio;
          audio.onended = () => {
            URL.revokeObjectURL(url);
            btn.disabled = false;
            btn.textContent = oldLabel;
          };
          audio.onerror = () => {
            URL.revokeObjectURL(url);
            btn.disabled = false;
            btn.textContent = oldLabel;
          };
          await audio.play();
        } catch (_) {
          btn.disabled = false;
          btn.textContent = oldLabel;
        }
      }
            function renderMessageBubble(cls, text) {
        const bubble = document.createElement("div");
        bubble.className = "msg " + (cls === "user" ? "user" : "bot");
        bubble.dataset.rawText = text;

        const textEl = document.createElement("div");
        setMessageBubbleContent(textEl, text);
        bubble.appendChild(textEl);

        if (cls !== "user") {
          const footer = document.createElement("div");
          footer.className = "msg-voice-row";
          const voiceBtn = document.createElement("button");
          voiceBtn.type = "button";
          voiceBtn.className = "tts-btn";
          voiceBtn.textContent = "🔊";
          voiceBtn.addEventListener("click", (ev) => {
            ev.stopPropagation();
            const currentText = bubble.dataset.rawText || textEl.textContent || "";
            speakBotText(currentText, voiceBtn);
          });
          footer.appendChild(voiceBtn);
          bubble.appendChild(footer);
        }

        bubble.addEventListener("contextmenu", (ev) => {
          ev.preventDefault();
          const currentText = bubble.dataset.rawText || textEl.textContent || "";
          openMsgActionMenu(currentText, ev.clientX, ev.clientY, bubble);
        });

        bubble.addEventListener("touchstart", (ev) => {
          if (ev.target.closest(".tts-btn")) return;
          if (cancelPendingLongPress) cancelPendingLongPress();
          const touch = ev.touches && ev.touches[0];
          const tx = touch ? touch.clientX : 24;
          const ty = touch ? touch.clientY : 120;
          const timer = setTimeout(() => {
            const currentText = bubble.dataset.rawText || textEl.textContent || "";
            openMsgActionMenu(currentText, tx, ty, bubble);
          }, LONG_PRESS_DURATION_MS);
          cancelPendingLongPress = () => clearTimeout(timer);
        }, { passive: true });

        bubble.addEventListener("touchend", () => {
          if (cancelPendingLongPress) {
            cancelPendingLongPress();
            cancelPendingLongPress = null;
          }
        });

        bubble.addEventListener("touchmove", () => {
          if (cancelPendingLongPress) {
            cancelPendingLongPress();
            cancelPendingLongPress = null;
          }
        }, { passive: true });

        chatEl.appendChild(bubble);
        chatEl.scrollTop = chatEl.scrollHeight;
        return { bubble, textEl };
      }

      function addMessage(cls, text, save = true) {
        const rendered = renderMessageBubble(cls, text);
        if (save) {
          let sess = getActiveSession();
          if (!sess) {
            sess = createNewSessionWithFirstMessage(text);
          }
          sess.messages.push({ cls: cls === "user" ? "user" : "bot", text });
          saveSessions();
          renderHistoryList();
        }
        return rendered;
      }

      function renderActiveSession() {
        if (!chatEl) return;
        chatEl.innerHTML = "";
        const sess = getActiveSession();
        if (!sess || !Array.isArray(sess.messages)) return;
        sess.messages.forEach((m) => {
          renderMessageBubble(m.cls, m.text);
        });
      }

      function renderHistoryList() {
        if (!historyListEl) return;
        Array.from(historyListEl.querySelectorAll(".history-item")).forEach((el) => el.remove());
        sessions.forEach((sess) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "history-item" + (sess.id === activeSessionId ? " active" : "");
          btn.textContent = sess.title || "New Chat";
          btn.addEventListener("click", () => {
            privateLinkBlocked = false;
            activeSessionId = sess.id;
            saveSessions();
            updateUrlForSession(sess);
            renderHistoryList();
            renderActiveSession();
            setDrawerOpen(false);
          });
          btn.addEventListener("contextmenu", (ev) => {
            ev.preventDefault();
            selectedSessionIdForMenu = sess.id;
            if (actionMenuEl) {
              actionMenuEl.classList.add("show");
              actionMenuEl.setAttribute("aria-hidden", "false");
            }
          });
          historyListEl.appendChild(btn);
        });
      }

      if (newChatBtn) {
        newChatBtn.addEventListener("click", () => {
          privateLinkBlocked = false;
          activeSessionId = null;
          updateUrlForSession(null);
          renderHistoryList();
          if (chatEl) {
            chatEl.innerHTML = "";
            const g = DUMMY_GREETINGS[Math.floor(Math.random() * DUMMY_GREETINGS.length)];
            renderMessageBubble("bot", g);
          }
          setDrawerOpen(false);
        });
      }

      if (copyMsgBtn) {
        copyMsgBtn.addEventListener("click", async () => {
          const ok = await copyToClipboard(selectedBotMessageText);
          showToast(ok ? "Copied" : "Copy failed");
          closeMsgActionMenu();
        });
      }

      if (renameHistoryBtn) {
        renameHistoryBtn.addEventListener("click", () => {
          const target = sessions.find((s) => s.id === selectedSessionIdForMenu);
          closeHistoryActionMenu();
          if (!target) return;
          const next = prompt("Rename", target.title || "New Chat");
          if (next && next.trim()) {
            target.title = next.trim();
            saveSessions();
            renderHistoryList();
          }
        });
      }

      if (shareHistoryBtn) {
        shareHistoryBtn.addEventListener("click", async () => {
          const target = sessions.find((s) => s.id === selectedSessionIdForMenu);
          closeHistoryActionMenu();
          if (!target) return;
          if (getShareMode() === "private") {
            showToast(PRIVATE_LINK_TEXT);
            return;
          }
          const ok = await copyToClipboard(buildShareUrl(target));
          showToast(ok ? "Link copied" : "Copy failed");
        });
      }

      if (deleteHistoryBtn) {
        deleteHistoryBtn.addEventListener("click", () => {
          const id = selectedSessionIdForMenu;
          closeHistoryActionMenu();
          if (!id) return;
          sessions = sessions.filter((s) => s.id !== id);
          if (activeSessionId === id) {
            activeSessionId = sessions[0] ? sessions[0].id : null;
            updateUrlForSession(getActiveSession());
            renderActiveSession();
          }
          saveSessions();
          renderHistoryList();
        });
      }

      document.addEventListener("click", (ev) => {
        if (!ev.target.closest("#msgActionMenu")) closeMsgActionMenu();
        if (!ev.target.closest("#historyActionMenu") && !ev.target.closest(".history-item")) {
          closeHistoryActionMenu();
        }
      });

      if (formEl && inpEl) {
        formEl.addEventListener("submit", async (ev) => {
          ev.preventDefault();
          const msg = (inpEl.value || "").trim();
          if (!msg) return;

          if (privateLinkBlocked) {
            addMessage("user", msg, false);
            addMessage("bot", PRIVATE_LINK_TEXT, false);
            inpEl.value = "";
            return;
          }

          inpEl.value = "";
          if (btnEl) btnEl.disabled = true;
          addMessage("user", msg, true);

          const botItem = renderMessageBubble("bot", "");
          botItem.bubble.dataset.rawText = "";
          setStatusLabel("Thinking...", "online");

          let finalReply = "";
          try {
            const sess = getActiveSession();
            const history = sess && Array.isArray(sess.messages)
              ? sess.messages.slice(-CONTEXT_MESSAGE_LIMIT)
              : [];

            const res = await fetch(BACKEND_STREAM_URL, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "X-API-Key": API_KEY,
                "ngrok-skip-browser-warning": "true"
              },
              body: JSON.stringify({ message: msg, history })
            });
            if (!res.ok || !res.body) throw new Error(String(res.status));

            const reader = res.body.getReader();
            const decoder = new TextDecoder("utf-8");
            let buf = "";

            while (true) {
              const { value, done } = await reader.read();
              if (done) break;
              buf += decoder.decode(value, { stream: true });
              const parts = buf.split("\n\n");
              buf = parts.pop() || "";

              for (const part of parts) {
                const line = part.split("\n").find((l) => l.startsWith("data: "));
                if (!line) continue;
                let evt;
                try {
                  evt = JSON.parse(line.slice(6).trim());
                } catch (_) {
                  continue;
                }
                if (evt.type === "status" && evt.status) {
                  setStatusLabel(evt.status, "online");
                } else if (evt.type === "delta" && typeof evt.text === "string") {
                  finalReply = evt.text;
                  botItem.bubble.dataset.rawText = finalReply;
                  setMessageBubbleContent(botItem.textEl, finalReply);
                  chatEl.scrollTop = chatEl.scrollHeight;
                } else if (evt.type === "done" && typeof evt.reply === "string" && evt.reply.trim()) {
                  finalReply = evt.reply.trim();
                }
              }
            }

            if (!finalReply) finalReply = "Hmm, I couldn't find the right words to answer that.";
            botItem.bubble.dataset.rawText = finalReply;
            setMessageBubbleContent(botItem.textEl, finalReply);
            setStatusLabel("Ready", "online");

            const activeSess = getActiveSession();
            if (activeSess) {
              activeSess.messages.push({ cls: "bot", text: finalReply });
              saveSessions();
            }
          } catch (_) {
            setMessageBubbleContent(botItem.textEl, SERVER_UNAVAILABLE_TEXT);
            botItem.bubble.dataset.rawText = SERVER_UNAVAILABLE_TEXT;
            setStatusLabel("Offline", "offline");
          } finally {
            if (btnEl) btnEl.disabled = false;
            chatEl.scrollTop = chatEl.scrollHeight;
          }
        });
      }

      loadSessions();
      const params = new URLSearchParams(window.location.search);
      const sParam = params.get("s");
      const cParam = params.get("chat");

      if (sParam) {
        if (getShareMode() === "private") {
          privateLinkBlocked = true;
          renderMessageBubble("bot", PRIVATE_LINK_TEXT);
        } else {
          const decoded = decodeSessionFromBase64(sParam);
          if (decoded) decoded.messages.forEach((m) => renderMessageBubble(m.cls, m.text));
        }
      } else if (cParam) {
        const found = sessions.find((s) => s.shareCode === cParam);
        if (found) {
          activeSessionId = found.id;
          renderActiveSession();
        }
      } else if (sessions.length > 0) {
        activeSessionId = sessions[0].id;
        renderActiveSession();
      } else {
        const g = DUMMY_GREETINGS[Math.floor(Math.random() * DUMMY_GREETINGS.length)];
        renderMessageBubble("bot", g);
      }

      renderHistoryList();
    })();
  </script>
</body>
</html>
