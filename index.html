<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playses AI</title>
  <style>
    body{font-family:sans-serif;background:#0b1120;color:#f8fafc;margin:0;padding:12px;display:flex;justify-content:center}
    .box{width:100%;max-width:640px;height:90dvh;background:#111827;border:1px solid #334155;border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
    .head{padding:12px 16px;border-bottom:1px solid #334155;display:flex;justify-content:space-between}
    .chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
    .msg{max-width:80%;padding:10px 12px;border-radius:10px;white-space:pre-wrap}
    .user{align-self:flex-end;background:#2563eb}
    .bot{align-self:flex-start;background:#1e293b;border:1px solid #334155}
    form{display:flex;gap:8px;padding:10px;border-top:1px solid #334155}
    input{flex:1;padding:10px;border-radius:8px;border:1px solid #334155;background:#0b1120;color:#fff}
    button{padding:10px 16px;border:none;border-radius:8px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}
    button:disabled{opacity:0.6;cursor:not-allowed}
  </style>
</head>
<body>
  <div class="box">
    <div class="head"><strong>Playses AI</strong><span id="st">Siap</span></div>
    <div id="chat" class="chat"><div class="msg bot">Halo! Coba ketik sesuatu.</div></div>
    <form id="f">
      <input id="inp" type="text" placeholder="Ketik pesanmu" autocomplete="off" required />
      <button id="btn" type="submit">Kirim</button>
    </form>
  </div>
  <script>
    const BACKEND_API_URL = "https://regular-datebook-outburst.ngrok-free.dev/chat";
    const API_KEY = "playses-ai-key-tetap";

    const f = document.getElementById("f");
    const inp = document.getElementById("inp");
    const btn = document.getElementById("btn");
    const chat = document.getElementById("chat");
    const st = document.getElementById("st");

    function addMsg(t, cls) {
      const d = document.createElement("div");
      d.className = "msg " + cls;
      d.textContent = t;
      chat.appendChild(d);
      chat.scrollTop = chat.scrollHeight;
      return d;
    }

    f.onsubmit = async function(e) {
      e.preventDefault();
      const val = inp.value.trim();
      if (!val) return;

      addMsg(val, "user");
      inp.value = "";
      inp.disabled = true;
      btn.disabled = true;
      st.textContent = "Membalas...";
      const b = addMsg("...", "bot");

      if (!BACKEND_API_URL) {
        b.textContent = "BACKEND_API_URL belum diisi.";
        st.textContent = "Siap";
        inp.disabled = false;
        btn.disabled = false;
        inp.focus();
        return;
      }

      try {
        const r = await fetch(BACKEND_API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-API-Key": API_KEY,
            "ngrok-skip-browser-warning": "true"
          },
          body: JSON.stringify({ message: val })
        });

        const rawText = await r.text();
        let data = {};
        try {
          data = JSON.parse(rawText);
        } catch (_) {
          data = { error: rawText || ("HTTP " + r.status) };
        }

        if (!r.ok) {
          b.textContent = data.error || ("Server balas error HTTP " + r.status);
          st.textContent = "Error";
        } else {
          b.textContent = data.reply || data.error || JSON.stringify(data);
          st.textContent = "Siap";
        }
      } catch (err) {
        b.textContent = "Gagal konek ke server: " + err.message;
        st.textContent = "Error";
      } finally {
        inp.disabled = false;
        btn.disabled = false;
        inp.focus();
      }
    };
  </script>
</body>
</html>
